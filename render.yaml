services:
  - type: web
    name: clinica-veterinaria-patitas-felices
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: DB_ENGINE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLINICA_WHATSAPP
        value: "51990853697"
