services:
  - type: web
    name: clinica-veterinaria-patitas-felices
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: DB_ENGINE
        value: sqlite
      - key: SQLITE_PATH
        value: database/patitas_felices.db
      - key: JWT_SECRET
        generateValue: true
      - key: CLINICA_WHATSAPP
        value: "51990853697"
